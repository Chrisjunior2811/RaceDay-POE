<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="RaceDay">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#12305c"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#ff5a1f" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="320" fill="url(#g)"/>
  <rect width="800" height="320" fill="url(#stripes)"/>
  <text x="400" y="185" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="96" fill="#ffffff" letter-spacing="6">RACE<tspan fill="#ff5a1f">DAY</tspan></text>
  <rect x="300" y="215" width="200" height="8" rx="4" fill="#c6f135"/>
</svg>
